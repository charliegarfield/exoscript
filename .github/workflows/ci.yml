name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  release:
    name: Release and publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # semantic-release needs full history and tags to find the last release
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Semantic release
        env:
          # Built-in Actions token; needs the job's `contents: write` permission
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Detect new release
        id: release
        # semantic-release tags HEAD when it cuts a release; no tag means
        # no release-worthy commits, so the publish step is skipped
        run: |
          TAG="$(git tag --points-at HEAD | grep '^v' | head -n 1 || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish to VS Code Marketplace
        if: steps.release.outputs.tag != ''
        env:
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          npm version "${{ steps.release.outputs.tag }}" --no-git-tag-version --allow-same-version
          npx @vscode/vsce publish -p "$PUBLISHER_TOKEN"
